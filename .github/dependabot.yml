# Updates to bundled dependencies change dist/, which Dependabot does not rebuild: check out the
# pull request, run `npm run bundle` and push the result before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # Node's type definitions follow the Node version the Action runs on (runs.using: node24).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
